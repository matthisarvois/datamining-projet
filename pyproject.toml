# ===============================================
# 🚀 OLIST RECOMMENDATION SYSTEM - PYPROJECT.TOML
# Master 2 - SEP
# ===============================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]


[project]
name = "olist-recommendation-system"
version = "1.0.0"
description = "Système de recommandation e-commerce pour l'enseignement du ML"
readme = "README.md"
authors = [
    {name = "Mohamed TRIBAK"}
]
keywords = [
    "machine-learning",
    "recommendation-system",
    "fastapi",
    "streamlit",
    "ecommerce",
    "education"
]
requires-python = ">=3.12"

# ==========================================
# 📦 DÉPENDANCES PRINCIPALES
# ==========================================
dependencies = [
    # Data Processing & Analysis
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "duckdb>=0.8.0",
    # Machine Learning & AI
    "scikit-learn>=1.1.0",
    "xgboost>=1.6.0",
    "lightgbm>=3.3.0",
    "joblib>=1.2.0",
    # Backend API
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=1.10.0",
    "python-multipart>=0.0.5",
    # Frontend & Visualization
    "streamlit>=1.20.0",
    "plotly>=5.13.0",
    "seaborn>=0.11.2",
    "matplotlib>=3.5.0",
    # Utilities & Development
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "loguru>=0.6.0",
    "psutil>=5.9.0",
    "pytest>=9.0.2",
]

# ==========================================
# 📦 DÉPENDANCES OPTIONNELLES
# ==========================================
[project.optional-dependencies]

# Groupe de dépendances pour les tests
test = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.1.0",
    "pytest-xdist>=3.2.0",
    "pytest-benchmark>=4.0.0",
    "httpx>=0.24.0",
    "coverage>=7.0.0",
    "faker>=19.0.0",
]

# Groupe pour le développement
dev = [
    "ruff",
    "pre-commit>=3.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

# Groupe pour le déploiement
deploy = [
    "docker>=6.0.0",
]

# Groupe pour l'analyse avancée
analysis = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "scipy>=1.9.0",
    "statsmodels>=0.13.0",
    "mlflow>=2.0.0",
]

# Installation complète
full = [
    "olist-recommendation-system[test,dev,deploy,analysis]"
]

[project.urls]
Homepage = "https://github.com/your-org/olist-recommendation-system"
Documentation = "https://your-org.github.io/olist-recommendation-system/"
Repository = "https://github.com/your-org/olist-recommendation-system.git"
"Bug Tracker" = "https://github.com/your-org/olist-recommendation-system/issues"

# ==========================================
# 🎯 POINTS D'ENTRÉE
# ==========================================
[project.scripts]
olist-train = "ml_pipeline.train_model:main"
olist-api = "backend.app.main:main"
olist-frontend = "frontend.app:main"
olist-setup = "setup:main"
run-tests = "tests.run_tests:main"

# ==========================================
# 🔧 CONFIGURATION DES OUTILS
# ==========================================

# Configuration pytest
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--maxfail=3",
    "--durations=10",
    "--color=yes",
]
markers = [
    "unit: Tests unitaires - testent des composants individuels",
    "integration: Tests d'intégration - testent l'interaction entre composants",
    "e2e: Tests end-to-end - testent des workflows complets",
    "slow: Tests lents - peuvent être exclus pour les tests rapides",
    "api: Tests spécifiques à l'API",
    "ml: Tests spécifiques au Machine Learning",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore:.*sklearn.*:FutureWarning",
    "ignore:.*numpy.*:FutureWarning",
]

# Configuration coverage
[tool.coverage.run]
source = ["ml_pipeline", "backend", "frontend"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "setup.py",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Configuration Ruff (linter moderne ultra-rapide)
[tool.ruff]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

# Configuration Bandit (sécurité)
[tool.bandit]
exclude_dirs = ["tests", "venv", "env"]
skips = ["B101", "B601"]  # Skip assert et shell usage en tests
