name: CI 

on:
  push:
  pull_request:

env:
  UV_CACHE_DIR: .uv-cache

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -a
          whoami
          python --version || true

      - name: Install uv + sync
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv --version
          uv sync || true

      # -----------------------
      # LINT (quick)
      # -----------------------
      - name: Lint (ruff if available)
        run: |
          if uv run ruff --version >/dev/null 2>&1; then
            uv run ruff check .
          else
            echo "ruff not installed -> skipping lint"
          fi

      # -----------------------
      # TYPECHECK (quick)
      # -----------------------
      - name: Typecheck (mypy if available)
        run: |
          if uv run mypy --version >/dev/null 2>&1; then
            uv run mypy --ignore-missing-imports src
          else
            echo "mypy not installed -> skipping typecheck"
          fi

      # -----------------------
      # AUDIT (quick)
      # -----------------------
      - name: Audit (pip-audit if available)
        run: |
          if uvx pip-audit --version >/dev/null 2>&1; then
            uvx pip-audit . || true
          else
            echo "pip-audit not available -> skipping audit"
          fi

      # -----------------------
      # TESTS (quick)
      # -----------------------
      - name: Tests (pytest if present)
        run: |
          if [ -d tests ]; then
            if uv run pytest --version >/dev/null 2>&1; then
              uv run pytest -q
            else
              echo "pytest not installed -> skipping tests"
            fi
          else
            echo "No tests/ directory -> skipping."
          fi
