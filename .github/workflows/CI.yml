name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: .uv-cache
  PRE_COMMIT_HOME: .cache/pre-commit
  MYPY_CACHE_DIR: .cache/mypy

jobs:
  ci:
    name: CI (lint + typecheck + audit + tests)
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Python + uv (self-hosted)
        run: |
          python3 --version
          command -v uv
          uv --version

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: .cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .cache/mypy
          key: mypy-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            mypy-cache-${{ runner.os }}-

      - name: Sync deps (uv) (include dev groups)
        run: |
          uv sync --frozen --all-groups || uv sync --all-groups

      - name: Lint (pre-commit)
        continue-on-error: true
        run: |
          uvx pre-commit run --all-files --show-diff-on-failure

      - name: Typecheck (mypy)
        continue-on-error: true
        run: |
          if [ -d src ]; then
            echo "Running mypy on src/"
            uv run mypy --ignore-missing-imports src
          elif [ -d app ]; then
            echo "Running mypy on app/"
            uv run mypy --ignore-missing-imports app
          else
            echo "No 'src/' or 'app/' directory found; skipping mypy. (Adjust the workflow to point mypy to your code directory.)"
          fi

      - name: Security audit (pip-audit)
        continue-on-error: true
        run: |
          uvx pip-audit --version
          uvx pip-audit .

      - name: Tests (pytest)
        run: |
          if [ -d tests ]; then
            uv run pytest --doctest-modules --maxfail=3 --disable-warnings -q || rc=$?
            if [ "${rc:-0}" -eq 5 ]; then
              echo "Pytest found no tests; skipping as success."
              exit 0
            else
              exit "${rc:-0}"
            fi
          else
            echo "No tests directory; skipping pytest."
          fi

      - name: Tests (behave)
        run: |
          if [ -d tests/behave/features ]; then
            uv run behave tests/behave/features
          else
            echo "No behave features; skipping behave."
          fi
