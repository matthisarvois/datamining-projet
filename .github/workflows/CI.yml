name: CI

on:
  push:
  pull_request:

env:
  UV_CACHE_DIR: .uv-cache

jobs:
  lint:
    name: lint (pre-commit)
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-

      - name: Install uv + sync
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv --version
          uv sync --frozen || uv sync

      - name: Run pre-commit
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure

  typecheck:
    name: typecheck (mypy)
    runs-on: self-hosted
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-
      - name: Install uv + sync
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv --version
          uv sync --frozen || uv sync
      - name: Run mypy
        run: |
          uv run mypy --ignore-missing-imports src

  audit:
    name: audit (pip-audit)
    runs-on: self-hosted
    needs: typecheck
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-
      - name: Install uv + sync
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv --version
          uv sync --frozen || uv sync
      - name: Run pip-audit
        run: |
          uvx pip-audit --version
          uvx pip-audit .

  test:
    name: test (pytest + behave)
    runs-on: self-hosted
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: .uv-cache
          key: uv-cache-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-cache-${{ runner.os }}-
      - name: Install uv + sync
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv --version
          uv sync --frozen || uv sync

      - name: Pytest (skip if no tests / treat "no tests" as success)
        run: |
          if [ -d tests ]; then
            uv run pytest --doctest-modules --maxfail=3 --disable-warnings -q || rc=$?
            if [ "${rc:-0}" -eq 5 ]; then
              echo "Pytest found no tests; skipping as success."
              exit 0
            else
              exit "${rc:-0}"
            fi
          else
            echo "No tests directory; skipping pytest."
          fi

      - name: Behave (skip if no features)
        run: |
          if [ -d tests/behave/features ]; then
            uv run behave tests/behave/features
          else
            echo "No behave features; skipping behave."
          fi
