# ===============================================
# 🧪 OLIST RECOMMENDATION SYSTEM - PYTEST CONFIG
# Master 2 - SEP
# ===============================================

[tool:pytest]
# Répertoires de tests
testpaths = tests

# Patterns de fichiers de tests
python_files = test_*.py *_test.py

# Patterns de classes de tests
python_classes = Test*

# Patterns de fonctions de tests
python_functions = test_*

# Markers personnalisés
markers =
    unit: Tests unitaires - testent des composants individuels
    integration: Tests d'intégration - testent l'interaction entre composants
    e2e: Tests end-to-end - testent des workflows complets
    slow: Tests lents - peuvent être exclus pour les tests rapides
    api: Tests spécifiques à l'API
    ml: Tests spécifiques au Machine Learning
    feature: Tests du feature engineering

# Options par défaut
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --maxfail=3
    --durations=10
    --color=yes
    --disable-warnings

# Minimum version de pytest
minversion = 6.0

# Répertoires à ignorer
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    logs
    data

# Configuration pour les tests asynchrones
asyncio_mode = auto

# Filtres de warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # Ignorer les warnings spécifiques à scikit-learn
    ignore:.*sklearn.*:FutureWarning
    ignore:.*numpy.*:FutureWarning

# Variables d'environnement pour les tests
env =
    TESTING = true
    LOG_LEVEL = WARNING
    PYTHONPATH = .

# Console output encoding
console_output_style = progress

# Timeout par défaut pour les tests (en secondes)
timeout = 300

# Configuration de coverage (si pytest-cov est installé)
# addopts = --cov=ml_pipeline --cov=backend --cov-report=html --cov-report=term-missing